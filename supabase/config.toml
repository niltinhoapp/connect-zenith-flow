# Supabase CLI — configuração local (base F0; ajustar project_id na F1).
project_id = "connectweb-automations"

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"

# F1: cadastro sem confirmação de e-mail (login imediato + provisionamento).
# No Supabase hospedado, o equivalente é Auth > Providers > Email > "Confirm email" = off.
[auth.email]
enable_confirmations = false

[storage]
enabled = true

# ── Edge Functions (F3.1 · WhatsApp) ─────────────────────────────────────────
# Webhook da Meta: público (a Meta chama sem JWT). A segurança é a assinatura
# X-Hub-Signature-256 + o verify_token.
[functions.whatsapp-webhook]
verify_jwt = false

# Conexão de WABA: exige o JWT do usuário (valida org + whatsapp.connect).
[functions.whatsapp-connect]
verify_jwt = true

# AI Automation Copilot: exige JWT do usuário (valida org + automacoes.manage).
# Secret: supabase secrets set ANTHROPIC_API_KEY=sk-ant-...
[functions.ai-generate-flow]
verify_jwt = true

# Assistente de WhatsApp: lê a conversa sob RLS e nunca envia mensagens.
[functions.ai-whatsapp-assist]
verify_jwt = true

# Copiloto global: valida o JWT e o RBAC dentro da função. `false` deixa o
# preflight OPTIONS chegar ao código, como nas demais funções chamadas pelo browser.
[functions.ai-copilot-intent]
verify_jwt = false

# Perguntas em linguagem natural consultam a RPC real e validam JWT/RBAC internamente.
[functions.ai-reports-answer]
verify_jwt = false

# API Pública: autenticação própria por chave `cw_live_*` (hash no banco).
[functions.public-api]
verify_jwt = false

# Checkout autentica o usuário e a permissão internamente; false permite o
# preflight OPTIONS do navegador. O webhook usa o token próprio do Asaas.
[functions.asaas-checkout]
verify_jwt = false

[functions.asaas-webhook]
verify_jwt = false

[functions.asaas-subscription-checkout]
verify_jwt = false
